; Witcher engine fix settings. 1 = on, 0 = off. Restart the game after changing.
[fixes]
; crash fix: death effect with a creator that no longer exists
fix1=1
; performance: do not pin the main thread to CPU 0
fix2=1
; experimental, off: keep shader effects cached (profiling showed no real recreation cost)
fix3=0
; save list: do not rewrite thumbnails that are already up to date
fix4=1
; saves: faster crc32 (identical result)
fix5=1
; above 60 FPS: hair (dangly nodes) damped per second like at 60 FPS instead of per frame
fix6=1
; save list: read the saves once at startup so the first list after a PC restart opens fast
fix7=1
; loading: keep the mipmaps D3DX builds for textures without them (disk cache), instead of rebuilding them every load
fix8=1
; loading: wait for the texture loader in 1 ms steps instead of 250 ms
fix9=1

[debug]
; diagnostics for development, written to witcher_enginefix.log. Leave them off.
; log how long building the load/save list takes, per step
savelist_timing=0
; log crc32 time and bytes per save (with fix5=0 it times the original crc32)
crc_timing=0
; log the first few hair damping calls (confirms fix6 runs)
dangly_log=0
; log how long the engine sleeps while waiting (per caller), and the texture wait after each load
wait_timing=0
; log how long creating each texture takes during loads (mipmaps built on the CPU)
texture_timing=0
; log stretches of low frame rate (3 s or longer below 30 FPS) with the window state
frame_log=0
