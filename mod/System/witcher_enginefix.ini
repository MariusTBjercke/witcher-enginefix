; Witcher engine fix settings. 1 = on, 0 = off. Restart the game after changing.
[fixes]
; crash fix: death effect with a creator that no longer exists
fix1=1
; performance: do not pin the main thread to CPU 0
fix2=1
; experimental, off: keep shader effects cached (profiling showed no real recreation cost)
fix3=0
; save list: do not rewrite thumbnails that are already up to date
fix4=1
; saves: faster crc32 (identical result)
fix5=1
; above 60 FPS: hair (dangly nodes) damped per second like at 60 FPS instead of per frame
fix6=1
; save list: read the saves once at startup so the first list after a PC restart opens fast
fix7=1
; loading: keep the mipmaps D3DX builds for textures without them (disk cache), instead of rebuilding them every load
fix8=1
; loading: wait for the texture loader in 1 ms steps instead of 250 ms
fix9=1
; cursor: come back in the middle of the screen after mouse look (it reappeared top-left above 1366x768)
fix10=1
; alt-tab: react at once when coming back to the game (it finished a 1 s background sleep first)
fix11=1

[qol]
; over-the-shoulder camera: hold the middle mouse button to turn the camera during active pause (Space)
ots_pause_mmb_camera=1
; borderless window: with full screen off, the game window has no border or title bar and covers the primary monitor
; at the desktop resolution (pick that resolution). Alt-tab is instant. Normally set in Options > Graphics
; ("Borderless window"); this line only counts until the menu has saved that option.
borderless=0
; quick loot: the key below presses "Take all" in the loot window (nothing in shops and storage). A bound key does
; nothing else, so with SPACE it also pauses and unpauses everywhere else, like the game's own Space.
; Ignored while the Witcher Quick Loot mod is installed (its own settings count then).
quick_loot=1
; one engine key name (see README), e.g. SPACE, F5, NUMPAD0. Any key but SPACE does nothing outside the loot window.
quick_loot_key=SPACE
; skip the logos and the intro cinematic at startup and go straight to the main menu
skip_intro=0

[graphics]
; longer LOD, grass, shadow and light distances on top of the game's own settings. Costs frame rate.
; 0 = the game's own distances, 1 = high, 2 = ultra
detail=0
; Ctrl+F12 in game cycles off -> high -> ultra and shows the level on screen (until the game exits; detail= is the start)
hotkey=1

[debug]
; diagnostics for development, written to witcher_enginefix.log. Leave them off.
; log how long building the load/save list takes, per step
savelist_timing=0
; log crc32 time and bytes per save (with fix5=0 it times the original crc32)
crc_timing=0
; log the first few hair damping calls (confirms fix6 runs)
dangly_log=0
; log how long the engine sleeps while waiting (per caller), and the texture wait after each load
wait_timing=0
; log how long creating each texture takes during loads (mipmaps built on the CPU)
texture_timing=0
; log stretches of low frame rate (3 s or longer below 30 FPS) with the window state, time in Present,
; how long Sleep(1) lasts, and a line 10 s after each return to the game (alt-tab lag)
frame_log=0
; with frame_log: full path to sampler.exe, run for 15 s when the alt-tab lag is detected (CSV next to the log)
frame_sampler=
; copy the engine's own messages (e.g. why a conversation was interrupted) and dialog state changes into the log
engine_log=0
